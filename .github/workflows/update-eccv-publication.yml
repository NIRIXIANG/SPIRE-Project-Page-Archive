name: Update ECCV publication info

'on':
  push:
    paths:
      - .github/workflows/update-eccv-publication.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update publication info
        run: echo '' | base64 -d | python
      - name: Commit
        run: git config user.name github-actions && git config user.email actions@github.com && git add index.html && git diff --cached --quiet || (git commit -m 'Use official ECCV Springer paper link and citation' && git push)
