name: Update ECCV publication info

on:
  push:
    paths:
      - '.github/workflows/update-eccv-publication.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update official paper link and citation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          official = 'https://link.springer.com/chapter/10.1007/978-3-032-37023-5_35'
          text = text.replace('https://arxiv.org/abs/2604.05363', official)

          new_bib = '''@inproceedings{ni2026rethinking,
  title={Rethinking IRSTD: Single-Point Supervision Guided Encoder-Only Framework Is Enough for Infrared Small Target Detection},
  author={Ni, Rixiang and Chen, Jun and Li, Boyang and Li, Yonghao and He, Wujiao and Wang, Yuji and Ren, Feiyu and Yuan, Haoyang and An, Wei},
  booktitle={Computer Vision -- ECCV 2026},
  series={Lecture Notes in Computer Science},
  volume={17069},
  pages={643--660},
  publisher={Springer},
  address={Cham},
  year={2026},
  doi={10.1007/978-3-032-37023-5_35},
  url={https://doi.org/10.1007/978-3-032-37023-5_35}
}'''

          pattern = r'(<pre><code data-bibtex>).*?(</code></pre>)'
          text, n = re.subn(pattern, lambda m: m.group(1) + new_bib + m.group(2), text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Citation block not found')

          # Keep the final DOM correct even if the exported client bundle hydrates older static data.
          marker = '<script id="eccv-official-publication-patch">'
          if marker not in text:
              patch = '''\n<script id="eccv-official-publication-patch">\n(() => {\n  const bib = `''' + new_bib.replace('`', '\\`') + '''`;\n  const apply = () => {\n    document.querySelectorAll('a[href="https://arxiv.org/abs/2604.05363"]').forEach(a => { a.href = "''' + official + '''"; });\n    const code = document.querySelector('[data-bibtex]');\n    if (code) code.textContent = bib;\n  };\n  apply();\n  setTimeout(apply, 250);\n  setTimeout(apply, 1000);\n})();\n</script>\n'''
              text = text.replace('</body>', patch + '</body>')

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit publication update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use official ECCV Springer paper link and citation"
            git push
          fi
